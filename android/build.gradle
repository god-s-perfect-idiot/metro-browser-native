// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Fix corrupted NDK before plugins try to use it
def checkAndFixNdk() {
  if (project.hasProperty('ndkVersion')) {
    def requestedNdkVersion = project.ext.ndkVersion
    def sdkRoot = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: "${System.getProperty('user.home')}/Library/Android/sdk"
    def ndkPath = new File(sdkRoot, "ndk/${requestedNdkVersion}")
    def sourceProps = new File(ndkPath, "source.properties")
    
    if (ndkPath.exists() && !sourceProps.exists()) {
      println "WARNING: NDK ${requestedNdkVersion} is corrupted (missing source.properties)"
      println "Please remove it and re-download: rm -rf ${ndkPath}"
      println "Or download via Android Studio: Tools > SDK Manager > SDK Tools > NDK"
      // Don't fail the build, but warn the user
    }
  }
}

// Check NDK before applying plugins
checkAndFixNdk()

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
